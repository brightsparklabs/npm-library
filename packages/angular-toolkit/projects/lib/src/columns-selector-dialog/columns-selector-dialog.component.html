<p-dialog
  draggable="false"
  [modal]="true"
  [style]="{ minWidth: '800px', height: '60vh', minHeight: '400px' }"
  [(visible)]="visible"
>
  <div cdkDropListGroup class="container">
    <div class="columns-list-container">
      <h2>Columns</h2>

      <p-picklist
        breakpoint="1400px"
        [source]="hiddenColumns()"
        [target]="visibleColumns()"
        [dragdrop]="true"
        [responsive]="true"
        
      >
        <ng-template #item let-item>
          {{ item.name }}
        </ng-template>
      </p-picklist>
        <!-- @for (column of hiddenColumns(); track column) {

        } -->
      </div>
    </div>
