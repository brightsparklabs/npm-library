<p-dialog
  draggable="false"
  header="Page Preferences"
  [modal]="true"
  [closable]="false"
  [resizable]="false"
  [style]="{
    'min-width': '60vw',
    'max-width': '80vw', 
    'max-height': '80vh', }"
  [(visible)]="visible"
>
  <h2>Column Visibility and Ordering</h2>
    <div class="modal-body">
          <div class="picklist-container">
            <p-picklist
              breakpoint="1400px"
              targetHeader="hiddenColumns"
              sourceHeader="visiblecolumns"
              [target]="hiddenColumns()"
              [source]="_visibleColumns()"
              [dragdrop]="true"
              [responsive]="true"  
            >
              <ng-template #item let-column>
                <div class="column-box">
                  {{ column.header }}
                </div>
              </ng-template>
            </p-picklist>
          </div>

    </div>
  <div class="buttons-container">
    <p-button label="Cancel" text severity="secondary" (onClick)="handleCancel()" />
    <p-button label="Reset to default" text severity="secondary" (onClick)="handleReset()" />
    <p-button label="Save" (onClick)="handleSave()" />
  </div>
</p-dialog>
