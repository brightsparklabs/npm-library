<p-dialog
  draggable="false"
  header="Page Preferences"
  [modal]="true"
  [closable]="false"
  [resizable]="false"
  [style]="{
    'min-width': '60vw',
    'max-width': '80vw', 
    'max-height': '80vh', }"
  [(visible)]="visible"
>
  <h2>Column Visibility and Ordering</h2>
    <div class="modal-body">
          <div class="picklist-container">
            <!-- 
              [metaKeySelection]="true" means that you have to hold ctrl to highlight
              multiple items in the picklist at once.
              To replicate the Duplicate items bug, either set this to false, or hold ctrl
              when selecting elements.
             -->
            <p-picklist
              breakpoint="1400px"
              sourceHeader="Visible Columns"
              targetHeader="Hidden Columns"
              sourceAriaLabel="Source"
              targetAriaLabel="Target"
              [target]="hiddenColumns()"
              [source]="_visibleColumns()"
              [showSourceControls]="false"
              [showTargetControls]="false"
              [dragdrop]="true"
              [responsive]="false"  
              [metaKeySelection]="true"
            >
              <ng-template #item let-column>
                <div class="column-box">
                  {{column[label()]}}
                </div>
              </ng-template>
            </p-picklist>
          </div>

    </div>
  <div class="buttons-container">
    <p-button label="Cancel" text severity="secondary" (onClick)="handleCancel()" />
    <p-button label="Reset to default" text severity="secondary" (onClick)="handleReset()" />
    <p-button label="Save" (onClick)="handleSave()" />
  </div>
</p-dialog>
